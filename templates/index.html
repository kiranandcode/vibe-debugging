<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vibe Debugger</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      margin: 0.25rem 0;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #e0e0e5;
      color: black;
      font-family: monospace;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 0.5rem;
      background: white;
    }

    #input {
      flex: 1;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #ddd;
      outline: none;
    }

    #send {
      margin-left: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: none;
      background: #007aff;
      color: white;
      border-radius: 12px;
      cursor: pointer;
    }

    #send:hover {
      background: #0051c4;
    }
#context-box {
  background: #111;
  color: #0f0;
  font-family: monospace;
  padding: 1rem;
  max-height: 200px;
  overflow-y: auto;
  border-bottom: 2px solid #333;
}

.context-title {
  font-weight: bold;
  margin-bottom: 0.5rem;
  color: #0ff;
}
  </style>
</head>
<body>
<!-- Add inside <body> before <div id="chat"> -->
<div id="context-box">
  <div class="context-title">LLDB Context</div>
  <pre id="context"></pre>
</div>
  <div id="chat"></div>

  <div id="input-area">
    <input id="input" type="text" placeholder="Ask a debugging question or run !lldb commands…" />
    <button id="send">Send</button>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    send.onclick = () => {
      const text = input.value.trim();
      if (text === '') return;
      addMessage(text, 'user');
      socket.emit('user_message', { message: text });
      input.value = '';
    };

    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') send.click();
    });

    socket.on('bot_message', (data) => {
      addMessage(data.message, 'bot');
    });
const contextEl = document.getElementById('context');
socket.on('context_update', (data) => {
  contextEl.textContent = data.context;
});
  </script>
</body>
</html>
